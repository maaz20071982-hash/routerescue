ples:[{title:`Source-Independent Ingestion & Multi-Feed Adapters`,desc:`Data collection is decoupled through modular adapters (CAD dispatch demo, NOAA/NWS alerts, Twitter API v2, Reddit OAuth). Feeds normalize incoming records into canonical schemas while preserving original source identifiers, URLs, publication times, and fetch times.`},{title:`Accessible Official Weather & Hazard Alerts (NOAA / NWS)`,desc:`Primary integration leverages documented public government alert endpoints (api.weather.gov) with standard User-Agent headers. Flash flood warnings, high wind advisories, and severe weather polygons are ingested with polygon centroid geocoding.`},{title:`Authorized Social Media Retrieval (Zero Scraping Policy)`,desc:`Social media signals are collected strictly through official developer APIs (Bearer token / OAuth). Web scraping, reverse-engineered tokens, and platform control bypasses are strictly prohibited. When credentials are unconfigured, integrations remain safely disabled with documented setup requirements.`},{title:`Location Uncertainty Marking for Operator Review`,desc:`When feeds provide broad forecast zones, polygon boundaries, or text keywords rather than exact street intersection pins, records are explicitly flagged with location_uncertain = true and a review explanation. Dispatchers review coordinates before heavy vehicle assignment.`},{title:`Repeat Ingestion Deduplication & Bounded Retries`,desc:`Periodic polling deduplicates existing records by external feed record key, refreshing ingestion timestamps and audit history without cloning records in storage. Network calls enforce strict timeouts (8s) and bounded retries with rate-limit backoff (HTTP 429).`},{title:`Transparent Per-Source Health & Cached-Data Labels`,desc:`System never invents API responses or silently substitutes demo data for failed live feeds. Live status (HEALTHY, DEGRADED, RATE_LIMITED, ERROR, DISABLED) is tracked per source. When cached data is served, records are explicitly labeled with is_cached = true and cached_at.`},{title:`Hazard-Aware Graph Routing (Dijkstra & A*)`,desc:`Routes are calculated dynamically over an explicit road network graph where nodes represent physical intersections and edges include calculated distance, speed limits, optional travel times, and hazard metadata. Real Dijkstra and A* algorithms evaluate optimal paths.`},{title:`Unverified Reports Generate Cautions, Never Close Roads`,desc:`In accordance with strict verification ethics, unverified social reports NEVER automatically close or sever roads. When a calculated route passes near an unverified report, the system emits a prominent visible caution notice while keeping the corridor fully open.`},{title:`Epistemic Safety: No Route is Guaranteed Safe`,desc:`RouteRescue never claims a calculated route is '100% safe' or invents arbitrary safety percentages. If data or graph connectivity is insufficient, the system explicitly reports so with diagnostic reasons.`}],dataFields:[{field:`source_feed_id`,type:`string`,description:`Originating data feed identifier (demo-feed, nws-weather-alerts, twitter, reddit)`},{field:`external_record_id`,type:`string`,description:`Primary record identifier from source external API`},{field:`location_uncertain`,type:`boolean`,description:`Flag indicating whether coordinates are broad, centroid-calculated, or require dispatcher review`},{field:`location_review_reason`,type:`string | null`,description:`Diagnostic explanation for location uncertainty`},{field:`is_cached`,type:`boolean`,description:`Indicates whether record was loaded from local feed cache rather than live response`},{field:`cached_at`,type:`ISO 8601 string | null`,description:`Timestamp when cached response was originally retrieved`},{field:`source_url`,type:`string (URL)`,description:`Preserved original public bulletin URL or permalink`},{field:`published_at`,type:`ISO 8601 string`,description:`Preserved original publication timestamp from source agency`},{field:`ingeste
